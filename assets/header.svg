<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Isabella Rizzi — where bugs become solutions. Jr. IT Analyst @ Seta Tech">
<style>
@font-face{font-family:'IT';font-weight:800;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'IT';font-weight:500;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FR';font-weight:500;font-style:italic;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'JB';font-weight:500;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}
.tag{font:500 18px 'JB',monospace;fill:#B9AEF7}
.name{font:800 76px 'IT',sans-serif;fill:#F4F3EF;letter-spacing:-3px}
.a{font:800 40px 'IT',sans-serif;fill:#F4F3EF;letter-spacing:-1.4px}
.b{font:italic 500 46px 'FR',serif;fill:#B9AEF7}
.sub{font:500 19px 'IT',sans-serif;fill:#B4B1C0}
.caret{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.glow{transform-origin:950px 175px;animation:pulse 5s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.15);opacity:.7}}
.bug{animation:bug 6s ease-in-out infinite}
.ok{animation:ok 6s ease-in-out infinite}
@keyframes bug{0%,35%{opacity:1;transform:none}45%,90%{opacity:0;transform:scale(.6) rotate(-20deg)}100%{opacity:1;transform:none}}
@keyframes ok{0%,38%{opacity:0;transform:scale(.6)}50%,85%{opacity:1;transform:none}95%,100%{opacity:0;transform:scale(.6)}}
.bug,.ok{transform-box:fill-box;transform-origin:center}
.ring{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.legs{transform-box:fill-box;transform-origin:center;animation:wiggle .35s ease-in-out infinite alternate}
@keyframes wiggle{to{transform:rotate(6deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.ok{opacity:0}}
</style>
<defs>
<pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".06"/></pattern>
<radialGradient id="rg" cx="950" cy="175" r="300" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#8C76F5" stop-opacity=".6"/><stop offset=".45" stop-color="#6E58E1" stop-opacity=".2"/><stop offset="1" stop-color="#141319" stop-opacity="0"/></radialGradient>
<radialGradient id="fade" cx="950" cy="175" r="520" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<mask id="m"><rect width="1200" height="340" fill="url(#fade)"/></mask>
<linearGradient id="cg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6B5BD6"/><stop offset=".5" stop-color="#B9AEF7"/><stop offset="1" stop-color="#F5A3C7"/></linearGradient>
<clipPath id="r"><rect width="1200" height="340" rx="20"/></clipPath>
</defs>
<g clip-path="url(#r)">
<rect width="1200" height="340" fill="#141319"/>
<rect width="1200" height="340" fill="url(#g)" mask="url(#m)"/>
<circle class="glow" cx="950" cy="175" r="300" fill="url(#rg)"/>
<text class="tag" x="64" y="84">&gt; isaa.dev<tspan class="caret">_</tspan></text>
<text class="name" x="60" y="164">Isabella Rizzi</text>
<text x="62" y="226"><tspan class="a">where bugs become </tspan><tspan class="b">solutions.</tspan></text>
<text class="sub" x="64" y="280">Jr. IT Analyst @ Seta Tech · Software Development &amp; Systems Support</text>
<circle class="ring" cx="950" cy="172" r="96" fill="none" stroke="url(#cg)" stroke-width="3" stroke-dasharray="14 10"/>
<circle cx="950" cy="172" r="78" fill="#1D1B24" stroke="#fff" stroke-opacity=".08"/>
<g class="bug" fill="none" stroke="#F28B9B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
  <g class="legs"><path d="M922 160h-18M922 180h-20M926 198l-14 12M978 160h18M978 180h20M974 198l14 12"/></g>
  <path d="M936 140l-10-14M964 140l10-14"/>
  <rect x="926" y="140" width="48" height="66" rx="24" fill="#2A1F27"/>
  <path d="M950 152v46"/>
</g>
<g class="ok" fill="none" stroke="#8FD9B6" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
  <path d="M922 174l18 18 38-40"/>
</g>
</g>
</svg>